description: >-
  Two things are priced here and they should not be confused. The Medusa PLATFORM is
  MIT-licensed open-source software and costs nothing — no license, no per-seat fee, and
  explicitly a 0.0% GMV platform fee on every tier. What is priced is Medusa CLOUD, the
  managed PaaS that hosts a Medusa application. Cloud pricing is infrastructure metering
  with a small monthly floor, which is why every tier reads "From $X/mo": the listed price
  is the entry point, and compute hours, data transfer, build minutes, edge requests,
  environments, seats and emails all meter above an included allowance.
