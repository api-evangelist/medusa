description: >-
  Medusa publishes no rate limits, and this is an honest zero rather than a missing page.
  Medusa is self-hosted software: the Store and Admin APIs run on the merchant's own
  infrastructure, so there is no Medusa-operated quota to publish and no throttle for
  Medusa to signal. Neither published OpenAPI document declares a 429 response, a
  RateLimit-*/X-RateLimit-* header or Retry-After on any of the 484 operations. The Medusa
  Cloud pricing page meters compute hours, data transfer, build minutes, edge requests and
  emails — consumption billing, not request-rate limiting — and states no requests-per-
  second ceiling.
