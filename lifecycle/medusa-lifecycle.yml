  - source: openapi/medusa-admin-openapi.yaml
    operationId: PostProductsImportTransaction_idConfirm
    path: POST /admin/products/import/{transaction_id}/confirm
    summary: Confirm Product Import
    note: Flagged deprecated:true in the spec; paired with PostProductsImport.
sla:
  url: https://medusajs.com/pricing
  public_uptime_target: null
  notes: >-
    No numeric uptime SLA is published. "SLA-backed uptime" and "SLA-backed response times"
    are listed as Enterprise-tier Cloud features on the pricing page; the numbers are not
    public. The open-source software carries no SLA at all — availability is the merchant's
    own infrastructure.
status_page:
