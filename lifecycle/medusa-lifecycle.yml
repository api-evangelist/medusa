  provider: Atlassian Statuspage
  page_name: Medusa Cloud
  api: https://status.medusajs.com/api/v2/summary.json
  scope: >-
    Covers Medusa Cloud only (component "API" and its siblings), not a self-hosted Medusa
    deployment. A merchant running Medusa themselves has no status page to watch — theirs
    is their own.
support:
