  - type: Authentication
    url: https://docs.medusajs.com/api/store#authentication
- aid: medusa:medusa-admin-api
  name: Medusa Admin API
  description: The Medusa Admin API is the merchant/operations REST surface of a Medusa application. It
    covers products, inventory, price lists, promotions and campaigns, orders, draft orders, order edits,
    claims, exchanges, returns, fulfillments, payments, customers and customer groups, sales channels,
    stock locations, tax regions, users, API keys, workflow executions and store settings. 407 operations
    across 59 tags, authenticated with a JWT bearer token, a session cookie, or a secret API key over
    HTTP Basic.
  tags:
  - E-Commerce
  - Commerce
  - Order Management
  - Inventory
  - Admin
  - Back Office
  humanURL: https://docs.medusajs.com/api/admin
