  baseURL: https://{medusa-backend-domain}/store/graphql
  properties:
  - url: graphql/medusa-graphql.md
    type: GraphQL
  description: >-
    Medusa's GraphQL surface over the store data core. The schema in this repo was derived from the OAS
    output schemas published in the medusajs/medusa repository; Medusa does not publish a hosted, introspectable
    GraphQL endpoint of its own because every Medusa application is self-hosted.
- aid: medusa:medusa-mcp-server
  name: Medusa MCP Remote Server
  description: >-
    Medusa hosts a Streamable HTTP Model Context Protocol server at https://docs.medusajs.com/mcp. It
    exposes the Medusa documentation to coding agents plus curated implementation-guide tools for data
    migration from Shopify/WooCommerce/Magento, payment and fulfillment provider integration, product
    extension, version upgrades and feedback submission. Access is limited to Medusa Cloud accounts and
    is authenticated with OAuth 2.1 (RFC 9728 protected resource) or a Cloud personal access key.
  tags:
  - MCP
  - Agentic Commerce
  - Documentation
  - AI
  humanURL: https://docs.medusajs.com/learn/introduction/build-with-llms-ai/mcp-server
  baseURL: https://docs.medusajs.com/mcp
