description: 'Medusa is an open-source, MIT-licensed digital commerce platform built around a modular
  architecture: a suite of Commerce Modules (cart, products, orders, pricing, promotions, tax, inventory,
  fulfillment, payment), a Framework for building custom API routes, data models, workflows and integrations,
  and a customizable Medusa Admin dashboard. Medusa ships two first-party REST APIs — a Store API for
  storefronts and an Admin API for merchant operations — both documented with published OpenAPI 3.0 specifications
  generated from the codebase. Medusa is self-hosted by default; MedusaJS, Inc. also operates Medusa Cloud,
  a managed PaaS, and a remote MCP server plus published Claude Code agent skills for agentic development.'
