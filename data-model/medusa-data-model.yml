id_conventions:
  format: Prefixed, underscore-separated string identifiers on every entity (the `id` field).
  note: Medusa does not publish a table of id prefixes in its API reference; prefixes are visible in example
    values throughout the docs (e.g. prod_, variant_, cart_, order_, cus_, reg_, sc_).
soft_delete:
  supported: true
  note: Most entities carry deleted_at; list operations accept with_deleted. See conventions/medusa-conventions.yml.
