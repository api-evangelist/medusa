method: derived
source: Derived from components.schemas in openapi/medusa-admin-openapi.yaml (593 schemas, 2.19.0) — entities
  are the schemas carrying an `id` plus `created_at`/`updated_at`; relationships come from $ref links
  (has_one / has_many) and from `*_id` reference fields (belongs_to). Domain grouping and the module mapping
  were checked against https://docs.medusajs.com/learn/fundamentals/modules/commerce-modules.
description: 'Medusa''s data model is deliberately modular, and the graph shows it. Rather than one monolithic
  schema, the entities cluster into Commerce Modules — Product, Pricing, Cart, Order, Inventory, Fulfillment,
  Payment, Customer, Promotion, Tax, Sales Channel — that are isolated from each other by design. Cross-module
  relationships are not foreign keys: Medusa joins them at runtime through MODULE LINKS and the Query/Index
  layer, which is why the schema references below understate how connected the model actually is at read
  time. A single 484-operation API sits on top of that graph.'
entity_count: 159
schema_count: 593
relationship_edges: 239
derivation_caveat: Two honest limits. (1) The Admin document names its schemas Admin* and the Store document
  names the same underlying records Store* — the graph below is derived from the Admin document, which
  is the superset. (2) Medusa's module links mean two entities can be related in a live Medusa application
  without either schema referencing the other; those edges are invisible to a spec-derived graph.
module_links:
  mechanism: Module links + the Link/Query/Index layer
  docs: https://docs.medusajs.com/learn/fundamentals/module-links
  note: The mechanism a merchant uses to attach a custom data model to a core one — a Brand to a Product,
    for example — without modifying the core module. This is the extension point Medusa's MCP get_product_custom_data_guide
    tool generates code for.
