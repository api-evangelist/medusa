scalar DateTime
scalar Date
scalar Time
scalar JSON

# ─── Enums ───────────────────────────────────────────────────────────────────

enum ProductStatus {
  draft
  proposed
  published
  rejected
}

enum GiftCardStatus {
  disabled
  enabled
}

enum ReturnStatus {
  open
  requested
  received
  partially_received
  canceled
}

enum OrderStatus {
  pending
  completed
  archived
  canceled
  requires_action
}

enum PaymentStatus {
  not_paid
  awaiting
  captured
  partially_captured
  partially_refunded
  refunded
  canceled
  requires_action
}

enum FulfillmentStatus {
  not_fulfilled
  partially_fulfilled
  fulfilled
  partially_shipped
  shipped
  partially_delivered
  delivered
  canceled
}

enum PaymentSessionStatus {
  authorized
  captured
  pending
  requires_more
  error
  canceled
}

enum ShippingOptionPriceType {
  flat
  calculated
}

enum PriceRuleOperator {
  eq
  ne
  gt
  gte
  lt
  lte
  in
  nin
}

