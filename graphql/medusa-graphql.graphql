# ─── Query ────────────────────────────────────────────────────────────────────

type Query {
  """
  Retrieve a list of products.
  """
  products(
    id: [String!]
    q: String
    handle: String
    collection_id: [String!]
    category_id: [String!]
    tag_id: [String!]
    type_id: [String!]
    sales_channel_id: [String!]
    region_id: String
    currency_code: String
    title: String
    status: [ProductStatus!]
    is_giftcard: Boolean
    order: String
    offset: Int
    limit: Int
  ): ProductConnection!

  """
  Retrieve a single product by ID or handle.
  """
  product(id: String, handle: String): Product

  """
  Retrieve a list of product variants.
  """
  productVariants(
    id: [String!]
    q: String
    product_id: [String!]
    sales_channel_id: [String!]
    region_id: String
    currency_code: String
    order: String
    offset: Int
    limit: Int
  ): ProductVariantConnection!

  """
  Retrieve a single product variant.
  """
  productVariant(id: String!): ProductVariant

  """
  Retrieve a list of product collections.
  """
  collections(
    id: [String!]
    q: String
    handle: [String!]
    order: String
    offset: Int
    limit: Int
  ): CollectionConnection!

  """
  Retrieve a single product collection.
  """
  collection(id: String, handle: String): ProductCollection

  """
  Retrieve a list of product categories.
  """
  productCategories(
    id: [String!]
    q: String
    handle: String
    parent_category_id: String
    include_ancestors_tree: Boolean
    include_descendants_tree: Boolean
    order: String
    offset: Int
    limit: Int
  ): CategoryConnection!

  """
  Retrieve a single product category.
  """
  productCategory(id: String, handle: String): ProductCategory

  """
  Retrieve a list of product tags.
  """
  productTags(
    id: [String!]
    q: String
    value: [String!]
    order: String
    offset: Int
    limit: Int
  ): ProductTagConnection!

  """
  Retrieve a list of product types.
  """
  productTypes(
    id: [String!]
    q: String
    value: [String!]
    order: String
    offset: Int
    limit: Int
  ): ProductTypeConnection!

  """
  Retrieve a list of regions.
  """
  regions(
    id: [String!]
    q: String
    order: String
    offset: Int
    limit: Int
  ): RegionConnection!

  """
  Retrieve a single region.
  """
  region(id: String!): Region

  """
  Retrieve a list of currencies.
  """
  currencies(
    code: [String!]
    q: String
    order: String
    offset: Int
    limit: Int
  ): CurrencyConnection!

  """
  Retrieve a single currency.
  """
  currency(code: String!): Currency

  """
  Retrieve a list of shipping options for a cart or return.
  """
  shippingOptions(
    cart_id: String
    is_return: Boolean
    region_id: String
    order: String
    offset: Int
    limit: Int
  ): ShippingOptionConnection!

  """
  Retrieve a list of return reasons.
  """
  returnReasons(
    id: [String!]
    offset: Int
    limit: Int
  ): ReturnReasonConnection!

  """
  Retrieve a single return reason.
  """
  returnReason(id: String!): ReturnReason

  """
  Retrieve a cart by ID.
  """
  cart(id: String!): Cart

  """
  Retrieve an order by ID.
  """
  order(id: String, display_id: Float): Order

  """
  Retrieve the authenticated customer's orders.
  """
  orders(
    id: [String!]
    q: String
    status: [OrderStatus!]
    offset: Int
    limit: Int
  ): OrderConnection!

  """
  Retrieve the authenticated customer.
  """
  customer: Customer

  """
  Retrieve the authenticated customer's addresses.
  """
  customerAddresses(
    offset: Int
    limit: Int
  ): CustomerAddressConnection!

  """
  Retrieve a payment collection by ID.
  """
  paymentCollection(id: String!): PaymentCollection

  """
  Retrieve available payment providers.
  """
  paymentProviders(
    region_id: String!
  ): [PaymentProvider!]!

  """
  Retrieve the store.
  """
  store: Store

  """
  Retrieve a gift card by code.
  """
  giftCard(code: String!): GiftCard

  """
  Retrieve a return by ID.
  """
  return(id: String!): Return
}

# ─── Mutation ─────────────────────────────────────────────────────────────────

type Mutation {
  """
  Create a new cart.
  """
  createCart(input: CreateCartInput): Cart!

  """
  Update a cart.
  """
  updateCart(id: String!, input: UpdateCartInput!): Cart!

  """
  Add a line item to a cart.
  """
  addCartLineItem(cart_id: String!, variant_id: String!, quantity: Float!, metadata: JSON): Cart!

  """
  Update a line item in a cart.
  """
  updateCartLineItem(cart_id: String!, item_id: String!, quantity: Float!, metadata: JSON): Cart!

  """
  Remove a line item from a cart.
  """
  removeCartLineItem(cart_id: String!, item_id: String!): Cart!

  """
  Add promotion codes to a cart.
  """
  addCartPromotions(cart_id: String!, promo_codes: [String!]!): Cart!

  """
  Remove a promotion code from a cart.
  """
  removeCartPromotion(cart_id: String!, promo_code: String!): Cart!

  """
  Add a gift card to a cart.
  """
  addGiftCardToCart(cart_id: String!, code: String!): Cart!

  """
  Remove a gift card from a cart.
  """
  removeGiftCardFromCart(cart_id: String!, code: String!): Cart!

  """
  Create a payment collection for a cart.
  """
  createPaymentCollection(cart_id: String!): PaymentCollection!

  """
  Initialize a payment session.
  """
  initializePaymentSession(payment_collection_id: String!, input: InitializePaymentSessionInput!): PaymentCollection!

  """
  Complete a cart and create an order.
  """
  completeCart(id: String!): Order!

  """
  Register a new customer.
  """
  createCustomer(input: CreateCustomerInput!): Customer!

  """
  Update the authenticated customer.
  """
  updateCustomer(input: UpdateCustomerInput!): Customer!

  """
  Add an address to the authenticated customer.
  """
  createCustomerAddress(input: CreateCustomerAddressInput!): CustomerAddress!

  """
  Update a customer address.
  """
  updateCustomerAddress(address_id: String!, input: UpdateCustomerAddressInput!): CustomerAddress!

  """
  Delete a customer address.
  """
  deleteCustomerAddress(address_id: String!): Boolean!

  """
  Transfer an order to another customer.
  """
  requestOrderTransfer(order_id: String!, new_owner_id: String!): Order!

  """
  Accept an order transfer.
  """
  acceptOrderTransfer(order_id: String!, token: String!): Order!

  """
  Decline an order transfer.
  """
  declineOrderTransfer(order_id: String!, token: String!): Order!

  """
  Create a return for an order.
  """
  createReturn(input: CreateReturnInput!): Return!

  """
  Claim a gift card store credit account.
  """
  claimStoreCreditAccount(token: String!): Customer!
}
