description: 'Medusa publishes its own Agent Skills. Nothing in this directory was authored by API Evangelist:
  every SKILL.md below is saved verbatim from Medusa''s public medusa-agent-skills repository, which ships
  four Claude Code plugins (medusa-dev, learn-medusa, ecommerce-storefront, medusa-cloud) through a marketplace
  manifest at .claude-plugin/marketplace.json, marketplace version 1.0.15. The same skills are installable
  outside Claude Code with `npx skills add medusajs/medusa-agent-skills`. Two of the plugins also bundle
  a .mcp.json that wires the Medusa remote MCP server (https://docs.medusajs.com/mcp) into the agent alongside
  the skills.'
install:
  claude_code_marketplace: /plugin marketplace add medusajs/medusa-agent-skills
  claude_code_install:
  - /plugin install medusa-dev@medusa
  - /plugin install learn-medusa@medusa
  - /plugin install ecommerce-storefront@medusa
  - /plugin install medusa-cloud@medusa
  other_agents: npx skills add medusajs/medusa-agent-skills
plugins:
- name: medusa-dev
  version: 1.0.12
  description: 'Comprehensive skills for building Medusa applications: backend (modules, workflows, API
    routes), admin UI (widgets, forms, tables), and storefronts (SDK integration, React Query).'
  bundles_mcp: https://docs.medusajs.com/mcp
  commands:
  - command: /medusa-dev:db-migrate
    description: Run database migrations for the Medusa project.
  - command: /medusa-dev:db-generate <module-name>
    description: Generate migrations for a custom module.
  - command: /medusa-dev:new-user <email> <password>
    description: Create an admin user with the specified email and password.
