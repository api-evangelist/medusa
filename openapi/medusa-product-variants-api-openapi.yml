openapi: 3.2.0
info:
  title: Medusa Product Variants API
  version: 2.19.0
  description: 'Operations tagged Product Variants across 2 of this provider''s published API definitions: medusa-admin-openapi.yaml, medusa-store-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
- url: https://api.medusajs.com
tags:
- name: Product Variants
  description: 'A product variant is a saleable form of the product.


    Each variant has different option values. For example, a "Shirt" product may have a  "Blue" variant and a "Green" variant. Customers choose from these variants when they buy the product.


    These API routes allow admin users to manage product variants.

    '
  externalDocs:
    description: Learn more about the Product Module
    url: https://docs.medusajs.com/resources/commerce-modules/product
  x-associatedSchema:
    $ref: '#/components/schemas/AdminProductVariant'
