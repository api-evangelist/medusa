components:
  schemas:
    AdminReservation:
      type: object
      description: The reservation's details.
      x-schemaName: AdminReservation
      required:
      - id
      - line_item_id
      - location_id
      - quantity
      - external_id
      - description
      - inventory_item_id
      properties:
        id:
          type: string
          title: id
          description: The reservation's ID.
        line_item_id:
          type: string
          title: line_item_id
          description: The ID of the line item this reservation is for.
        location_id:
          type: string
          title: location_id
          description: The ID of the location the quantity is reserved from.
        quantity:
          type: number
          title: quantity
          description: The reservation's quantity.
        external_id:
          type: string
          title: external_id
          description: An ID in an external system
        description:
          type: string
          title: description
          description: The reservation's description.
        inventory_item_id:
          type: string
          title: inventory_item_id
          description: The ID of the inventory item this reservation is associated with.
        inventory_item:
          $ref: '#/components/schemas/AdminInventoryItem'
        metadata:
          type: object
          description: The reservation's metadata, can hold custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
        created_by:
          type: string
          title: created_by
          description: The ID of the user that created this reservation.
        deleted_at:
          type: string
          format: date-time
          title: deleted_at
          description: The date this reservation was deleted.
        created_at:
          type: string
          format: date-time
          title: created_at
          description: The date this reservation was created.
        updated_at:
          type: string
          format: date-time
          title: updated_at
          description: The date this reservation was updated.
    Error:
      title: Response Error
      type: object
      properties:
        code:
          type: string
          description: A slug code to indicate the type of the error.
          enum:
          - invalid_state_error
          - invalid_request_error
          - api_error
          - unknown_error
        message:
          type: string
          description: Description of the error that occurred.
          example: first_name must be a string
        type:
          type: string
          description: A slug indicating the type of the error.
          enum:
          - QueryRunnerAlreadyReleasedError
          - TransactionAlreadyStartedError
          - TransactionNotStartedError
          - conflict
          - unauthorized
          - payment_authorization_error
          - duplicate_error
          - not_allowed
          - invalid_data
          - not_found
          - database_error
          - unexpected_state
          - invalid_argument
          - unknown_error
    AdminInventoryItem:
      type: object
      description: The inventory item's details.
      x-schemaName: AdminInventoryItem
      required:
      - id
      - requires_shipping
      - stocked_quantity
      - reserved_quantity
      properties:
        id:
          type: string
          title: id
          description: The inventory item's ID.
        sku:
          type: string
          title: sku
          description: The inventory item's sku.
        origin_country:
          type: string
          title: origin_country
          description: The inventory item's origin country.
        hs_code:
          type: string
          title: hs_code
          description: The inventory item's HS code.
        requires_shipping:
          type: boolean
          title: requires_shipping
          description: Whether the inventory item requires shipping.
        mid_code:
          type: string
          title: mid_code
          description: The inventory item's MID code.
        material:
          type: string
          title: material
          description: The inventory item's material.
        weight:
          type: number
          title: weight
          description: The inventory item's weight.
        length:
          type: number
          title: length
          description: The inventory item's length.
        height:
          type: number
          title: height
          description: The inventory item's height.
        width:
          type: number
          title: width
          description: The inventory item's width.
        title:
          type: string
          title: title
          description: The inventory item's title.
        description:
          type: string
          title: description
          description: The inventory item's description.
        thumbnail:
          type: string
          title: thumbnail
          description: The thumbnail URL of the inventory item.
        metadata:
          type: object
          description: Custom key-value pairs, used to store additional information about the inventory item.
        location_levels:
          type: array
          description: The inventory item's location levels.
          items:
            $ref: '#/components/schemas/AdminInventoryLevel'
        stocked_quantity:
          type: number
          title: stocked_quantity
          description: The inventory item's stocked quantity.
        reserved_quantity:
          type: number
          title: reserved_quantity
          description: The inventory item's reserved quantity.
    AdminUpdateReservation:
      type: object
      description: The properties to update in the reservation.
      properties:
        location_id:
          type: string
          title: location_id
          description: The ID of the associated location.
        quantity:
          type: number
          title: quantity
          description: The reserved quantity.
        description:
          type: string
          title: description
          description: The reservation's description.
        metadata:
          type: object
          description: The reservation's metadata. Can hold custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
      x-schemaName: AdminUpdateReservation
    AdminInventoryLevel:
      type: object
      description: The location level's location levels.
      x-schemaName: AdminInventoryLevel
      required:
      - id
      - created_at
      - updated_at
      - deleted_at
      - inventory_item_id
      - location_id
      - stocked_quantity
      - reserved_quantity
      - incoming_quantity
      - metadata
      - available_quantity
      properties:
        id:
          type: string
          title: id
          description: The location level's ID.
        created_at:
          type: string
          format: date-time
          title: created_at
          description: The location level's created at.
        updated_at:
          type: string
          format: date-time
          title: updated_at
          description: The location level's updated at.
        deleted_at:
          type: string
          format: date-time
          title: deleted_at
          description: The location level's deleted at.
        inventory_item_id:
          type: string
          title: inventory_item_id
          description: The location level's inventory item id.
        location_id:
          type: string
          title: location_id
          description: The location level's location id.
        stocked_quantity:
          type: number
          title: stocked_quantity
          description: The location level's stocked quantity.
        reserved_quantity:
          type: number
          title: reserved_quantity
          description: The location level's reserved quantity.
        incoming_quantity:
          type: number
          title: incoming_quantity
          description: The location level's incoming quantity.
        metadata:
          type: object
          description: The location level's metadata.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
        inventory_item:
          type: object
        available_quantity:
          type: number
          title: available_quantity
          description: The location level's available quantity.
    AdminReservationResponse:
      type: object
      description: The reservation's details.
      x-schemaName: AdminReservationResponse
      required:
      - reservation
      properties:
        reservation:
          $ref: '#/components/schemas/AdminReservation'
    AdminCreateReservation:
      type: object
      description: The reservation's details.
      x-schemaName: AdminCreateReservation
      required:
      - location_id
      - inventory_item_id
      - quantity
      properties:
        line_item_id:
          type: string
          title: line_item_id
          description: The ID of the line item this reservation is created for.
        location_id:
          type: string
          title: location_id
          description: The ID of the location the quantity is reserved from.
        inventory_item_id:
          type: string
          title: inventory_item_id
          description: The ID of the inventory item associated with the line item's variant.
        quantity:
          type: number
          title: quantity
          description: The reserved quantity.
        description:
          type: string
          title: description
          description: The reservation's description.
        metadata:
          type: object
          description: The reservation's metadata, used to store custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
  responses:
    invalid_request_error:
      description: Invalid Request Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request_error
            message: Discount with code TEST already exists.
            type: duplicate_error
    invalid_state_error:
      description: Invalid State Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unknown_error
            message: The request conflicted with another request. You may retry the request with the provided Idempotency-Key.
            type: QueryRunnerAlreadyReleasedError
    500_error:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            database:
              $ref: '#/components/examples/database_error'
            unexpected_state:
              $ref: '#/components/examples/unexpected_state_error'
            invalid_argument:
              $ref: '#/components/examples/invalid_argument_error'
            default_error:
              $ref: '#/components/examples/default_error'
    unauthorized:
      description: User is not authorized. Must log in first
      content:
        text/plain:
          schema:
            type: string
            default: Unauthorized
            example: Unauthorized
    400_error:
      description: Client Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_allowed:
              $ref: '#/components/examples/not_allowed_error'
            invalid_data:
              $ref: '#/components/examples/invalid_data_error'
    not_found_error:
      description: Not Found Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Entity with id 1 was not found
            type: not_found
  examples:
    unexpected_state_error:
      summary: Unexpected State Error
      value:
        message: cart.total must be defined
        type: unexpected_state
    database_error:
      summary: Database Error
      value:
        code: api_error
        message: An error occured while hashing password
        type: database_error
    default_error:
      summary: Default Error
      value:
        code: unknown_error
        message: An unknown error occurred.
        type: unknown_error
    invalid_argument_error:
      summary: Invalid Argument Error
      value:
        message: cart.total must be defined
        type: unexpected_state
    not_allowed_error:
      summary: Not Allowed Error
      value:
        message: Discount must be set to dynamic
        type: not_allowed
    invalid_data_error:
      summary: Invalid Data Error
      value:
        message: first_name must be a string
        type: invalid_data
  securitySchemes:
    api_token:
      type: http
      x-displayName: API Token
      scheme: basic
    jwt_token:
      type: http
      x-displayName: JWT Token
      scheme: bearer
    cookie_auth:
      type: apiKey
      in: cookie
      name: connect.sid
      x-displayName: Cookie Session ID
    reset_password:
      type: http
      x-displayName: Reset Password Token
      scheme: bearer
      x-is-auth: false
