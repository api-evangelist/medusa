openapi: 3.2.0
info:
  version: 2.19.0
  title: Medusa Admin Invites API
  license:
    name: MIT
    url: https://github.com/medusajs/medusa/blob/develop/LICENSE
  description: 'An admin can invite new users to manage their team. This allows new users to authenticate as admins and perform admin functionalities.


    These API routes allow admin users to manage invites.

    '
servers:
- url: http://localhost:9000
- url: https://api.medusajs.com
tags:
- name: Invites
