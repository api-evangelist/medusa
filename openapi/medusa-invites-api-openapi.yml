        '422':
          $ref: '#/components/responses/invalid_request_error'
        '500':
          $ref: '#/components/responses/500_error'
      x-workflow: createInvitesWorkflow
      security:
      - api_token: []
      - cookie_auth: []
      - jwt_token: []
      x-events:
      - name: invite.created
        payload: "```ts\n{\n  id, // The ID of the invite\n}\n```"
        description: 'Emitted when invites are created. You can listen to this event

          to send an email to the invited users, for example.'
        deprecated: false
  /admin/invites/accept:
    post:
      operationId: PostInvitesAccept
      summary: Accept Invite
      description: 'Accept an invite and create a new user.

        Since the user isn''t created yet, the JWT token used in the authorization header is retrieved from the `/auth/user/emailpass/register` API route (or a provider other than `emailpass`). The user can then authenticate using the `/auth/user/emailpass` API route.

        '
      x-authenticated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGetInviteAcceptParams'
      x-codeSamples:
      - lang: JavaScript
        label: JS SDK
        source: "import Medusa from \"@medusajs/js-sdk\"\n\nexport const sdk = new Medusa({\n  baseUrl: import.meta.env.VITE_BACKEND_URL || \"/\",\n  debug: import.meta.env.DEV,\n  auth: {\n    type: \"session\",\n  },\n})\n\nawait sdk.auth.register(\"user\", \"emailpass\", {\n  email: \"user@gmail.com\",\n  password: \"supersecret\"\n})\n\n// all subsequent requests will use the token in the header\nconst { user } = await sdk.admin.invite.accept(\n  {\n    email: \"user@gmail.com\",\n    first_name: \"John\",\n    last_name: \"Smith\",\n    invite_token: \"12345...\"\n  },\n)"
      - lang: Shell
        label: cURL
        source: "curl -X POST '{backend_url}/admin/invites/accept?token={invite_token}' \\\n-H 'Content-Type: application/json' \\\n--data-raw '{\n  \"email\": \"Lila_Zemlak@hotmail.com\",\n  \"first_name\": \"{value}\",\n  \"last_name\": \"{value}\"\n}'"
      tags:
      - Invites
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  description: The created user's details.
                  required:
                  - user
                  properties:
                    user:
                      $ref: '#/components/schemas/AdminUser'
                - type: object
                  description: An error's details.
                  required:
                  - message
                  properties:
                    message:
                      type: string
                      title: message
                      description: The error message.
        '400':
          $ref: '#/components/responses/400_error'
        '401':
          $ref: '#/components/responses/unauthorized'
        '404':
          $ref: '#/components/responses/not_found_error'
        '409':
          $ref: '#/components/responses/invalid_state_error'
        '422':
          $ref: '#/components/responses/invalid_request_error'
        '500':
          $ref: '#/components/responses/500_error'
      x-workflow: acceptInviteWorkflow
      security:
      - cookie_auth: []
      - jwt_token: []
      x-events:
      - name: user.created
        payload: "```ts\n{\n  id, // The ID of the user\n}\n```"
        description: Emitted when users are created.
        deprecated: false
      - name: invite.accepted
        payload: "```ts\n{\n  id, // The ID of the invite\n}\n```"
        description: Emitted when an invite is accepted.
        deprecated: false
      parameters:
      - name: token
        in: query
        description: The invite's token.
        required: true
        schema:
          type: string
          title: token
          description: The invite's token.
      - name: fields
        in: query
        description: Comma-separated fields that should be included in the returned data. If a field is prefixed with `+` it will be added to the default fields, using `-` will remove it from the default fields. Without prefix it will replace the entire default fields.
        required: false
        schema:
