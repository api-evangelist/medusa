openapi: 3.2.0
info:
  title: Medusa Product Tags API
  version: 2.19.0
  description: 'Operations tagged Product Tags across 2 of this provider''s published API definitions: medusa-admin-openapi.yaml, medusa-store-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
- url: https://api.medusajs.com
tags:
- name: Product Tags
  description: 'A tag is another way of organizing a product. Each tag has a name and a value.


    Products are organized into the same tag if they have the same value.


    These API routes allow admin users to manage product tags.

    '
  externalDocs:
    description: Learn more about the Product Module
    url: https://docs.medusajs.com/resources/commerce-modules/product
  x-associatedSchema:
    $ref: '#/components/schemas/AdminProductTag'
