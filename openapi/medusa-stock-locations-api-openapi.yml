            url: https://en.wikipedia.org/wiki/ISO_3166-2
            description: Learn more about ISO 3166-2
        metadata:
          type: object
          description: The address's metadata.
      required:
      - id
      - address_1
      - address_2
      - company
      - country_code
      - city
      - phone
      - postal_code
      - province
      - metadata
    AdminStockLocationDeleteResponse:
      type: object
      description: The details of the stock location's deletion.
      x-schemaName: AdminStockLocationDeleteResponse
      required:
      - id
      - object
      - deleted
      properties:
        id:
          type: string
          title: id
          description: The stock location's ID.
        object:
          type: string
          title: object
          description: The name of the deleted object.
          default: stock_location
        deleted:
          type: boolean
          title: deleted
          description: Whether the stock location was deleted.
    AdminUpsertStockLocationAddress:
      type: object
      description: The details of the stock location address to create.
      x-schemaName: AdminUpsertStockLocationAddress
      required:
      - country_code
      - address_1
      properties:
        address_1:
          type: string
          title: address_1
          description: The address's first line.
        address_2:
          type: string
          title: address_2
          description: The address's second line.
        company:
          type: string
          title: company
          description: The address's company.
        country_code:
          type: string
          title: country_code
          description: The address's country code.
          example: usd
        city:
          type: string
          title: city
          description: The address's city.
        phone:
          type: string
          title: phone
          description: The address's phone.
        postal_code:
          type: string
          title: postal_code
          description: The address's postal code.
        province:
          type: string
          title: province
          description: The address's ISO 3166-2 province code. Must be lower-case.
          example: us-ca
          externalDocs:
            url: https://en.wikipedia.org/wiki/ISO_3166-2
            description: Learn more about ISO 3166-2
        metadata:
          type: object
          description: The address's metadata.
    AdminStockLocationResponse:
      type: object
      description: The stock location's details.
      x-schemaName: AdminStockLocationResponse
      required:
      - stock_location
      properties:
        stock_location:
          $ref: '#/components/schemas/AdminStockLocation'
  responses:
    invalid_request_error:
      description: Invalid Request Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_request_error
            message: Discount with code TEST already exists.
            type: duplicate_error
    invalid_state_error:
      description: Invalid State Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: unknown_error
            message: The request conflicted with another request. You may retry the request with the provided Idempotency-Key.
            type: QueryRunnerAlreadyReleasedError
    500_error:
      description: Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            database:
              $ref: '#/components/examples/database_error'
            unexpected_state:
              $ref: '#/components/examples/unexpected_state_error'
            invalid_argument:
              $ref: '#/components/examples/invalid_argument_error'
            default_error:
              $ref: '#/components/examples/default_error'
    unauthorized:
      description: User is not authorized. Must log in first
      content:
        text/plain:
          schema:
            type: string
            default: Unauthorized
            example: Unauthorized
    400_error:
      description: Client Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            not_allowed:
              $ref: '#/components/examples/not_allowed_error'
            invalid_data:
              $ref: '#/components/examples/invalid_data_error'
    not_found_error:
      description: Not Found Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Entity with id 1 was not found
            type: not_found
  examples:
    unexpected_state_error:
      summary: Unexpected State Error
      value:
        message: cart.total must be defined
        type: unexpected_state
    database_error:
      summary: Database Error
      value:
        code: api_error
        message: An error occured while hashing password
        type: database_error
    default_error:
      summary: Default Error
      value:
        code: unknown_error
        message: An unknown error occurred.
        type: unknown_error
    invalid_argument_error:
      summary: Invalid Argument Error
      value:
        message: cart.total must be defined
        type: unexpected_state
    not_allowed_error:
      summary: Not Allowed Error
      value:
        message: Discount must be set to dynamic
        type: not_allowed
    invalid_data_error:
      summary: Invalid Data Error
      value:
        message: first_name must be a string
        type: invalid_data
  securitySchemes:
    api_token:
      type: http
      x-displayName: API Token
      scheme: basic
    jwt_token:
      type: http
      x-displayName: JWT Token
      scheme: bearer
    cookie_auth:
      type: apiKey
      in: cookie
      name: connect.sid
      x-displayName: Cookie Session ID
    reset_password:
      type: http
      x-displayName: Reset Password Token
      scheme: bearer
      x-is-auth: false
