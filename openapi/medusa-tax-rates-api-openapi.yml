components:
  schemas:
    AdminUpdateTaxRate:
      type: object
      description: The properties to update in the tax rate.
      x-schemaName: AdminUpdateTaxRate
      properties:
        rate:
          type: number
          title: rate
          description: The rate to charge.
        code:
          type: string
          title: code
          description: The code that the tax rate is identified by.
        rules:
          type: array
          description: The tax rate's rules.
          items:
            $ref: '#/components/schemas/AdminCreateTaxRateRule'
        name:
          type: string
          title: name
          description: The tax rate's name.
        is_default:
          type: boolean
          title: is_default
          description: Whether the tax rate is the default in the store.
        is_combinable:
          type: boolean
          title: is_combinable
          description: Whether the tax rate should be combined with parent rates.
          externalDocs:
            url: https://docs.medusajs.com/resources/commerce-modules/tax/tax-rates-and-rules#combinable-tax-rates
        metadata:
          type: object
          description: The tax rate's metadata, can hold custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
    AdminTaxRateResponse:
      type: object
      description: The tax rate's details.
      x-schemaName: AdminTaxRateResponse
      required:
      - tax_rate
      properties:
        tax_rate:
          $ref: '#/components/schemas/AdminTaxRate'
    AdminTaxRegion:
      type: object
      description: The tax region's details.
      x-schemaName: AdminTaxRegion
      required:
      - id
      - country_code
      - province_code
      - metadata
      - parent_id
      - created_at
      - updated_at
      - deleted_at
      - created_by
      - tax_rates
      - parent
      - children
      properties:
        id:
          type: string
          title: id
          description: The tax region's ID.
        country_code:
          type: string
          title: country_code
          description: The tax region's country code.
          example: us
        province_code:
          type: string
          title: province_code
          description: The tax region's lower-case ISO 3166-2 province code.
          example: us-ca
          externalDocs:
            url: https://en.wikipedia.org/wiki/ISO_3166-2
            description: Learn more about ISO 3166-2
        metadata:
          type: object
          description: The tax region's metadata, can hold custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
        parent_id:
          type: string
          title: parent_id
          description: The ID of the parent tax region.
        created_at:
          type: string
          format: date-time
          title: created_at
          description: The date the tax region was created.
        updated_at:
          type: string
          format: date-time
          title: updated_at
          description: The date the tax region was updated.
        deleted_at:
          type: string
          format: date-time
          title: deleted_at
          description: The date the tax region was deleted.
        created_by:
          type: string
          title: created_by
          description: The ID of the user that created the tax region.
        tax_rates:
          type: array
          description: The tax region's rates.
          items:
            type: object
        parent:
          type: object
        children:
          type: array
          description: The tax region's children.
          items:
            type: object
    AdminTaxRateRule:
      type: object
      description: The tax rate rule's details.
      x-schemaName: AdminTaxRateRule
      required:
      - reference
      - reference_id
      - created_at
      properties:
        reference:
          type: string
          title: reference
          description: The name of the table this rule references.
          example: product_type
        reference_id:
          type: string
          title: reference_id
          description: The ID of a record in the table that this rule references.
          example: ptyp_1
        created_at:
          type: string
          format: date-time
          title: created_at
          description: The date the tax rate rule was created.
    Error:
      title: Response Error
      type: object
      properties:
        code:
          type: string
          description: A slug code to indicate the type of the error.
          enum:
          - invalid_state_error
          - invalid_request_error
          - api_error
          - unknown_error
        message:
          type: string
          description: Description of the error that occurred.
          example: first_name must be a string
        type:
          type: string
          description: A slug indicating the type of the error.
          enum:
          - QueryRunnerAlreadyReleasedError
          - TransactionAlreadyStartedError
          - TransactionNotStartedError
          - conflict
          - unauthorized
          - payment_authorization_error
          - duplicate_error
          - not_allowed
          - invalid_data
          - not_found
          - database_error
          - unexpected_state
          - invalid_argument
          - unknown_error
    AdminTaxRate:
      type: object
      description: The tax rate's details.
      x-schemaName: AdminTaxRate
      required:
      - id
      - rate
      - code
      - name
      - metadata
      - tax_region_id
      - is_combinable
      - is_default
      - created_at
      - updated_at
      - deleted_at
      - created_by
      - tax_region
      - rules
      properties:
        id:
          type: string
          title: id
          description: The tax rate's ID.
        rate:
          type: number
          title: rate
          description: The rate to charge.
          example: 10
        code:
          type: string
          title: code
          description: The code the tax rate is identified by.
        name:
          type: string
          title: name
          description: The tax rate's name.
        metadata:
          type: object
          description: The tax rate's metadata, can hold custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
        tax_region_id:
          type: string
          title: tax_region_id
          description: The ID of the tax region this rate belongs to.
        is_combinable:
          type: boolean
          title: is_combinable
          description: Whether the tax rate should be combined with parent rates.
          externalDocs:
            url: https://docs.medusajs.com/resources/commerce-modules/tax/tax-rates-and-rules#combinable-tax-rates
        is_default:
          type: boolean
          title: is_default
          description: Whether this tax rate is the default in the tax region.
        created_at:
          type: string
          format: date-time
          title: created_at
          description: The date the tax rate was created.
        updated_at:
          type: string
          format: date-time
          title: updated_at
          description: The date the tax rate was updated.
        deleted_at:
          type: string
          format: date-time
          title: deleted_at
          description: The date the tax rate was deleted.
        created_by:
          type: string
          title: created_by
          description: The ID of the user that created the tax rate.
        tax_region:
          $ref: '#/components/schemas/AdminTaxRegion'
        rules:
          type: array
          description: The tax rate's rules.
          items:
            $ref: '#/components/schemas/AdminTaxRateRule'
    AdminCreateTaxRate:
      type: object
      description: The tax rate's details.
      x-schemaName: AdminCreateTaxRate
      required:
      - name
      - tax_region_id
      - code
      properties:
        name:
          type: string
          title: name
          description: The tax rate's name.
          example: VAT
        tax_region_id:
          type: string
          title: tax_region_id
          description: The ID of the tax region this rate belongs to.
        rate:
          type: number
          title: rate
          description: The rate to charge.
          example: 10
        code:
          type: string
          title: code
          description: The code the tax rate is identified by.
        rules:
          type: array
          description: The tax rate's rules.
          items:
            $ref: '#/components/schemas/AdminCreateTaxRateRule'
        is_default:
          type: boolean
          title: is_default
          description: Whether the tax rate is the default in its tax region.
        is_combinable:
          type: boolean
          title: is_combinable
          description: Whether the tax rate should be combined with parent rates.
          externalDocs:
            url: https://docs.medusajs.com/resources/commerce-modules/tax/tax-rates-and-rules#combinable-tax-rates
        metadata:
          type: object
          description: The tax rate's metadata, used to store custom key-value pairs.
          externalDocs:
            url: https://docs.medusajs.com/api/admin#manage-metadata
            description: Learn how to manage metadata
    AdminTaxRateDeleteResponse:
      type: object
      description: The details of the tax rate deletion.
      x-schemaName: AdminTaxRateDeleteResponse
      required:
      - id
      - object
      - deleted
      properties:
        id:
          type: string
          title: id
          description: The tax rate's ID.
        object:
          type: string
          title: object
          description: The name of the deleted object.
          default: tax_rate
        deleted:
          type: boolean
          title: deleted
          description: Whether the tax rate was deleted.
    AdminCreateTaxRateRule:
      type: object
      description: The tax rate rule's details.
      x-schemaName: AdminCreateTaxRateRule
      required:
      - reference
      - reference_id
      properties:
        reference:
          type: string
          title: reference
          description: The name of a table in the database that this rule points to.
          example: product_type
        reference_id:
          type: string
          title: reference_id
          description: The ID of a record in the table specified in reference.
          example: ptype_123
