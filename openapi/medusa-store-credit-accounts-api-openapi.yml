info:
  title: Medusa Store Credit Accounts API
  version: 2.19.0
  description: 'Operations tagged Store Credit Accounts across 2 of this provider''s published API definitions: medusa-admin-openapi.yaml, medusa-store-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
- url: https://api.medusajs.com
tags:
- name: Store Credit Accounts
  description: 'A store credit account is a ledger of store credit transactions for a customer. They hold the customer''s store credit balance,  including their credit and debit amounts.

    Store credit accounts allow you to build features that let customers pay for items using their store credit balance, such as gift cards or loyalty points.

    These API routes allow admin users to manage store credit accounts, their transactions, and more.

    <Note>

    Store Credit Account routes are only available for Cloud users using the [Loyalty Plugin](https://docs.medusajs.com/resources/commerce-modules/loyalty).

    </Note>

    '
