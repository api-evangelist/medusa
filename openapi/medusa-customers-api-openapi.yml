  title: Medusa Customers API
  version: 2.19.0
  description: 'Operations tagged Customers across 2 of this provider''s published API definitions: medusa-admin-openapi.yaml, medusa-store-openapi.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
- url: https://api.medusajs.com
tags:
- name: Customers
  description: 'Customers can either be created when they register through the Store APIs, or created by the admin using the Admin APIs.


    These API routes allow admin users to manage customers in their store.

    '
  externalDocs:
    description: Learn more about the Customer Module
    url: https://docs.medusajs.com/resources/commerce-modules/customer
  x-associatedSchema:
    $ref: '#/components/schemas/AdminCustomer'
