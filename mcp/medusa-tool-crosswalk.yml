  mcp_tools_bound_to_rest: 0
  rest_operations: 484
  rest_operations_with_a_tool: 0
  graphql_fields_bound: 0
  overlap_percent: 0
  interpretation: >-
    Zero overlap is a real architectural fact about Medusa, not a measurement gap. Medusa
    sells a self-hosted platform: the commerce API belongs to the merchant's own deployment,
    so a Medusa-operated MCP server has no store to point at. The agent surface Medusa
    actually ships for operating a store is the published OpenAPI plus the agent skills in
    skills/ — an agent talks to the merchant's own Medusa instance directly.
