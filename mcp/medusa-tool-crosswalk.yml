generated: '2026-08-26'
method: derived
source: >-
  Derived by binding every documented Medusa MCP tool (mcp/medusa-mcp.yml) to the operations
  in the published Store and Admin OpenAPI documents (openapi/). No fabrication: the MCP
  tool list comes from Medusa's own per-tool documentation chapters, the REST operations
  come from the specs, and the binding below is the honest result of comparing them.
description: >-
  The headline finding is a clean, total divergence. Medusa's MCP server and Medusa's REST
  APIs do not overlap at all. Every one of the seven MCP tools is a DOCUMENTATION or
  IMPLEMENTATION-GUIDE tool that returns prose and code for a developer's agent to act on;
  none of them calls a Medusa store. Every one of the 484 REST operations is a live commerce
  operation with no MCP tool in front of it. An agent connected to Medusa's MCP server can
  learn how to build a Medusa store; it cannot read a product, price a cart, or refund a
  payment. That gap is the whole crosswalk, and it is worth stating plainly rather than
  padding with speculative bindings.
surfaces:
  openapi:
    - file: openapi/medusa-store-openapi.yaml
      title: Medusa Storefront API
      version: 2.19.0
      operations: 77
      gated: false
    - file: openapi/medusa-admin-openapi.yaml
      title: Medusa Admin API
      version: 2.19.0
      operations: 407
      gated: false
  graphql:
    endpoint: null
    artifact: graphql/medusa-graphql.md
    gated: true
    note: >-
      No hosted, introspectable GraphQL endpoint exists — every Medusa application is
      self-hosted, so there is no single URL to introspect. The SDL in graphql/ was derived
      from the OAS output schemas in the medusajs/medusa repository.
  mcp:
    url: https://docs.medusajs.com/mcp
    gated: true
    note: >-
      tools/list returns HTTP 401 with an RFC 9728 OAuth challenge; the server is limited to
      Medusa Cloud accounts. Tool names are taken from Medusa's published documentation, so
      binding confidence is set from name and documented semantics, not from a live schema.
crosswalk: []
mcp_only:
  - tool: ask_medusa_question
    reason: >-
      Documentation search. Returns Medusa documentation sections with source URLs. There is no documentation-search operation in either OpenAPI document.
  - tool: get_import_data_from_shopify_or_other_platform_guide
    reason: >-
      Returns a migration implementation guide. Medusa's own data-import REST operations (POST /admin/products/import) are DEPRECATED in the Admin spec, and the tool returns a guide for building a custom import module rather than calling them.
  - tool: get_payment_provider_integration_guide
    reason: >-
      Returns a guide for authoring a Payment Module Provider — a server-side code artifact. The Admin API only lists already-registered providers (GET /admin/payments/payment-providers); it cannot create one.
  - tool: get_fulfillment_provider_integration_guide
    reason: >-
      Returns a guide for authoring a Fulfillment Module Provider. GET /admin/fulfillment-providers lists registered providers; there is no create-provider operation.
  - tool: get_product_custom_data_guide
    reason: >-
      Returns a guide for attaching custom data to product data models via a module link. This is a code-generation task; the closest REST surface is the generic metadata field on product operations, which is not the same capability.
  - tool: get_medusa_upgrade_instructions
    reason: >-
      Returns version upgrade instructions. Upgrading is an operator task performed against the codebase and database, not an API call.
  - tool: submit_medusa_feedback
    reason: >-
      Sends structured feedback to the Medusa team. No public REST equivalent.
