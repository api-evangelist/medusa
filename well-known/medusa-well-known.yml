source: >-
  Live GET probes of /.well-known/* on every host named in apis.yml (baseURL/humanURL)
  and in the published OpenAPI servers[] blocks, on 2026-08-26.
description: >-
  Medusa serves two real /.well-known documents, both on the documentation host and both
  in service of the Medusa MCP remote server: an RFC 9728 OAuth protected-resource
  descriptor and an RFC 8414 authorization-server metadata document. The JWKS the
  authorization-server document points at is served from the Medusa Cloud API host and is
  saved here too. Nothing else is served. Two negative findings matter: (1) medusajs.com
  and docs.medusajs.com return real 404s for security.txt, api-catalog, ai-plugin.json and
  both agent-card paths — an honest absence; (2) cloud.medusajs.com is a single-page app
  that answers HTTP 200 with an HTML shell for EVERY /.well-known path, so none of its
  200s are documents and none are credited here.
hosts:
