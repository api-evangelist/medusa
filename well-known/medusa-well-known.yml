    documents:
      - path: /.well-known/oauth-protected-resource
        status: 200
        type: application/json
        file: medusa-oauth-protected-resource.json
        note: RFC 9728 protected-resource metadata for the MCP server at /mcp.
      - path: /.well-known/oauth-authorization-server
